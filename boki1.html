<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>簿記1級 学習ノート｜TODOROKI</title><meta name="description" content="簿記1級の会計学を、解説と確認問題で学ぶ。研究開発費とソフトウェアを収録。"><link rel="canonical" href="https://todoroki-gold.com/boki1"><style>
:root{color-scheme:dark;--gold:#e4c46e;--border:#5d4c27}*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#f6f1e6;font:16px/1.8 system-ui,sans-serif}a{color:var(--gold)}header{border-bottom:1px solid var(--border);padding:18px max(5%,calc((100% - 1000px)/2));display:flex;justify-content:space-between;gap:15px;align-items:center}header a{font-weight:800;letter-spacing:.12em;text-decoration:none}main{max-width:1000px;padding:36px 20px 80px;margin:auto}.eyebrow{color:var(--gold);font-size:.8rem;letter-spacing:.18em;font-weight:700}h1{font-size:clamp(1.8rem,5vw,3rem);line-height:1.35;margin:8px 0}h2{font-size:1.4rem}h3{margin:0 0 8px}.intro{color:#c9c2b3;max-width:720px}.notice{border-left:3px solid var(--gold);padding:10px 16px;background:#18160f;color:#e3d7b7}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}button,select,input{font:inherit}button,select{background:#181818;border:1px solid #65532e;color:#f6f1e6;border-radius:8px;padding:10px 15px;cursor:pointer}button:hover,button:focus-visible{border-color:#f3d77d;outline-color:#f3d77d}button.active{background:var(--gold);color:#111;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}.card,.quiz{background:#151513;border:1px solid #403824;border-radius:12px;padding:22px}.card p{color:#d2cbbb;margin:8px 0}.label{color:var(--gold);font-size:.8rem;font-weight:700}.question{margin-bottom:20px}.answers{display:grid;gap:8px}.answers button{text-align:left;width:100%}.feedback{min-height:1em;color:#f2d78c}.result{font-weight:700;color:var(--gold)}.small{font-size:.88rem;color:#bcb5a6}footer{padding:24px;text-align:center;border-top:1px solid #302815;color:#999}section[hidden]{display:none}input{width:100%;padding:12px;border:1px solid #65532e;background:#151515;color:#fff;border-radius:8px}a:focus-visible{outline:2px solid white;outline-offset:3px}</style></head><body><header><a href="/">TODOROKI</a><a href="/">サイトへ戻る</a></header><main><div class="eyebrow">ACCOUNTING STUDY / 01</div><h1>簿記1級 学習ノート</h1><p class="intro">会計の考え方を、短い解説と確認問題でひとつずつ。まずは研究開発費とソフトウェアを学びます。</p><p class="notice">公開中の範囲：会計学の一部。簿記1級の全範囲を網羅した教材ではありません。</p><nav class="toolbar" aria-label="学習メニュー"><button class="active" data-view="learn">解説を読む</button><button data-view="quiz">確認問題に挑戦</button></nav><section id="learn"><h2>研究開発費とソフトウェア</h2><p class="small">知りたい言葉で検索できます。</p><input id="search" type="search" placeholder="例：研究、償却、自社利用" aria-label="解説を検索"><p id="count" class="small"></p><div class="grid" id="cards"></div></section><section id="quiz" hidden><h2>確認問題</h2><p class="small">全4問。選択すると解説が表示されます。</p><div id="questions"></div><p class="result" id="result" aria-live="polite"></p><button id="reset">もう一度解く</button></section><p class="small">参考：<a href="https://www.asb-j.jp/jp/accounting_standards_system/details.html?topics_id=82">企業会計基準委員会 研究開発費等に係る会計基準</a>、<a href="https://www.kentei.ne.jp/bookkeeping/35697-2">商工会議所 簿記検定試験出題区分表</a>。会計基準や出題範囲は変更される場合があります。</p></main><footer>© TODOROKI</footer><script>
const lessons=[{title:'研究と開発',body:'研究は新しい知識の発見を目的とする計画的な調査や探求。開発は研究成果などを具体化して、新製品や新しい生産方法の計画・設計などに役立てる活動です。',tag:'基本'}, {title:'研究開発費の処理',body:'研究開発費は、原則として発生した時に費用として処理します。将来の収益を得られるか、発生時点では確実ではないためです。',tag:'会計処理'}, {title:'研究専用の設備',body:'特定の研究開発にのみ使用し、他の目的に使用できない機械装置などの取得原価は、取得時の研究開発費として扱います。',tag:'会計処理'}, {title:'自社利用ソフトウェア',body:'将来の収益獲得または費用削減が確実と認められる自社利用ソフトウェアの取得費用は、資産に計上し、利用期間にわたり償却します。研究開発に該当する部分は費用です。',tag:'ソフトウェア'}, {title:'市場販売目的の償却',body:'資産計上した市場販売目的のソフトウェアは、見込販売数量などに基づく合理的な方法で償却します。毎期の償却額は、残存有効期間による均等配分額を下回ることはできません。',tag:'ソフトウェア'}, {title:'見込販売数量の変更',body:'見込販売数量などを見直した場合は、変更後の見積りに基づき、変更した年度以降の償却額を計算します。',tag:'見積り'}];
const qs=[{q:'研究開発費の基本的な会計処理は？',a:['発生時に費用として処理する','必ず資産に計上する','販売が始まるまで計上しない'],correct:0,ex:'研究開発費は発生時に費用として処理します。'}, {q:'自社利用ソフトウェアの取得費用を資産に計上する条件は？',a:['利用する予定があるだけ','将来の収益獲得または費用削減が確実','すべて研究開発費である'],correct:1,ex:'将来の収益獲得または費用削減が確実と認められる場合に資産計上します。'}, {q:'他の目的に使用できない研究専用の機械装置の取得原価は？',a:['取得時の研究開発費','必ず建物として計上','売却時まで処理しない'],correct:0,ex:'特定の研究開発目的にのみ使い、他に使用できない場合は取得時の研究開発費です。'}, {q:'市場販売目的のソフトウェアの償却額の下限は？',a:['常にゼロ','残存有効期間に基づく均等配分額','当期売上高の半額'],correct:1,ex:'合理的な方法で算出した償却額は、残存有効期間による均等配分額を下回ることはできません。'}];
const cards=document.querySelector('#cards'),count=document.querySelector('#count');function renderCards(){const v=document.querySelector('#search').value.trim().toLowerCase();const rows=lessons.filter(x=>(x.title+x.body+x.tag).toLowerCase().includes(v));cards.replaceChildren();rows.forEach(x=>{let el=document.createElement('article');el.className='card';let tag=document.createElement('div');tag.className='label';tag.textContent=x.tag;let h=document.createElement('h3');h.textContent=x.title;let p=document.createElement('p');p.textContent=x.body;el.append(tag,h,p);cards.append(el)});count.textContent=rows.length+'件の解説'+(rows.length?'':'：別の言葉で検索してください')};document.querySelector('#search').addEventListener('input',renderCards);renderCards();document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#learn').hidden=b.dataset.view!=='learn';document.querySelector('#quiz').hidden=b.dataset.view!=='quiz'}));let chosen={};function renderQuiz(){const target=document.querySelector('#questions');target.replaceChildren();qs.forEach((q,i)=>{const block=document.createElement('div');block.className='quiz question';const h=document.createElement('h3');h.textContent=(i+1)+'. '+q.q;const options=document.createElement('div');options.className='answers';q.a.forEach((answer,j)=>{const b=document.createElement('button');b.textContent=answer;b.disabled=chosen[i]!==undefined;b.addEventListener('click',()=>{chosen[i]=j;renderQuiz()});options.append(b)});block.append(h,options);if(chosen[i]!==undefined){let p=document.createElement('p');p.className='feedback';p.textContent=(chosen[i]===q.correct?'正解！ ':'不正解。正解：'+q.a[q.correct]+'。 ')+q.ex;block.append(p)}target.append(block)});let n=Object.keys(chosen).length;document.querySelector('#result').textContent=n===qs.length?'結果：'+qs.filter((q,i)=>chosen[i]===q.correct).length+' / '+qs.length+'問正解':''}document.querySelector('#reset').addEventListener('click',()=>{chosen={};renderQuiz()});renderQuiz();</script></body></html>
