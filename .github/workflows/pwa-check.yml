name: TODOROKI PWA validation
on:
  pull_request:
    paths:
      - 'app/**'
      - '_headers'
      - '_redirects'
      - 'index.html'
      - 'login.html'
      - 'assets/header-account.js'
      - 'assets/pwa-install.js'
      - 'assets/equity-web-entry.js'
      - 'assets/economy-mobile-launch.js'
      - 'worker.js'
      - 'tool-entry-v2.mjs'
      - 'tools/quality/tool-entry-v2*.test.mjs'
      - 'tools/quality/equity-web-entry.test.mjs'
      - 'tools/quality/economy-mobile-launch.test.mjs'
      - 'tools/quality/economy-mobile-launch.browser.mjs'
      - 'tools/quality/unified-home*.mjs'
      - 'tools/quality/behavioral-part-one-browser.mjs'
      - 'tools/quality/behavioral-part-three-browser.mjs'
      - 'tools/quality/behavioral-part-three-events.test.mjs'
      - 'assets/behavioral-part-three-events.js'
      - 'behavioral-economics.html'
      - 'scripts/check-pwa.py'
      - '.github/workflows/pwa-check.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/check-pwa.py
      - run: python3 scripts/check-login-redirect.py
      - run: node --test tools/quality/unified-home.test.mjs
      - run: node tools/quality/tool-entry.test.mjs
      - run: node tools/quality/tool-entry-v2.test.mjs
      - run: node tools/quality/tool-entry-v2-multi.test.mjs
      - run: node --test tools/quality/equity-web-entry.test.mjs tools/quality/economy-mobile-launch.test.mjs
      - name: Chromium desktop and mobile viewport regressions
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node tools/quality/unified-home-browser.mjs
          node tools/quality/behavioral-part-one-browser.mjs
          node tools/quality/behavioral-part-three-browser.mjs
      - run: node tools/quality/behavioral-part-three-events.test.mjs
      - name: WebKit economy card navigation regression
        run: |
          npx playwright install --with-deps webkit
          node tools/quality/economy-mobile-launch.browser.mjs
