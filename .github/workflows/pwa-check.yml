name: TODOROKI PWA validation
on:
  pull_request:
    paths:
      - 'app/**'
      - 'scripts/check-pwa.py'
      - '.github/workflows/pwa-check.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-pwa.py
