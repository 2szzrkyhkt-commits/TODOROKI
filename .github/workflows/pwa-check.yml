name: TODOROKI PWA validation
on:
  pull_request:
    paths:
      - 'app/**'
      - 'index.html'
      - 'worker.js'
      - 'tool-entry-v2.mjs'
      - 'tools/quality/tool-entry*.mjs'
      - 'tools/quality/tool-verify-diagnostics.test.mjs'
      - 'scripts/check-pwa.py'
      - '.github/workflows/pwa-check.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/check-pwa.py
      - name: Tool entry and security regressions
        run: |
          node tools/quality/tool-entry.test.mjs
          node tools/quality/tool-verify-diagnostics.test.mjs
          node tools/quality/tool-entry-v2.test.mjs
          node tools/quality/tool-entry-v2-multi.test.mjs
          node tools/quality/security.test.mjs
