name: TODOROKI quality audit
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [hourly, daily, weekly, monthly]
        default: daily
  pull_request:
    paths: ['tools/sync-page-discovery.mjs', 'tools/quality/**', 'tools/japan-support/**', 'tools/tax/**', '.github/workflows/quality-audit.yml']
  push:
    branches: [main]
    paths-ignore: ['docs/TODOROKI-TODO.md']
  deployment_status:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event_name == 'pull_request' && github.head_ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  audit:
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-24.04
    # Official browser and native libraries matched to the pinned npm version below.
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 55
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Trust this job checkout inside the browser image
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: |
          node tools/sync-page-discovery.mjs
          node tools/quality/page-discovery-sync.test.mjs
          node --test tools/quality/article-revival.test.mjs
          python -m unittest discover -s tools/quality -p 'test_*.py' -v
          node --test tools/quality/watchdog.test.mjs
          node tools/quality/security.test.mjs
          python tools/quality/source-restore.py
          python tools/quality/publication.py
          python tools/quality/t04_scope.py
      - name: Support collection policy and isolation regressions
        working-directory: tools/japan-support
        run: node test.mjs
      - name: Provide the verified GitHub CLI for the audit ledger
        run: |
          if command -v gh >/dev/null 2>&1; then exit 0; fi
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          asset=gh_2.106.0_linux_amd64
          curl --fail --silent --show-error --location --proto '=https' --max-time 120 \
            "https://github.com/cli/cli/releases/download/v2.106.0/$asset.tar.gz" -o "$work/gh.tar.gz"
          printf '%s  %s\n' 'a476449fa9625413c54a3734eded62e9e480e49f421ff08e7f3b3879c059a033' "$work/gh.tar.gz" | sha256sum -c -
          tar -xzf "$work/gh.tar.gz" -C "$work" "$asset/bin/gh"
          install -D -m 0755 "$work/$asset/bin/gh" "$RUNNER_TEMP/quality-bin/gh"
          printf '%s\n' "$RUNNER_TEMP/quality-bin" >> "$GITHUB_PATH"
      - name: Load durable ledger
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/quality/state.py
      - name: Select JST audit cadence
        id: cadence
        env:
          REQUESTED: ${{ inputs.mode }}
        run: echo "mode=$(python tools/quality/cadence.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.cadence.outputs.mode != 'hourly'
        with:
          node-version: '22'
      - name: Browser dependencies
        if: steps.cadence.outputs.mode != 'hourly'
        env:
          MODE: ${{ steps.cadence.outputs.mode }}
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2
          # The matching Playwright image supplies the native libraries. Do not
          # refresh machine-wide apt feeds during the audit.
          case "$MODE" in
            daily) npx playwright install chromium ;;
            weekly|monthly) npx playwright install chromium firefox webkit ;;
            *) echo "Unexpected browser audit mode: $MODE" >&2; exit 1 ;;
          esac
      - name: Generate production article and ticker markup
        if: steps.cadence.outputs.mode != 'hourly'
        run: node tools/sync-article-revival.mjs
      - name: Ticker endurance and WebKit regression
        if: github.event_name == 'pull_request'
        run: |
          npx playwright install webkit
          PLAYWRIGHT_ENGINE=webkit node tools/quality/article-revival-browser.mjs
          TICKER_LONG_SMOKE=1 node tools/quality/article-revival-browser.mjs
      - name: Browser checks
        if: steps.cadence.outputs.mode != 'hourly'
        env:
          MODE: ${{ steps.cadence.outputs.mode }}
        run: |
          node tools/quality/consent.mjs
          node tools/quality/browser.mjs
          node tools/quality/page-search-browser.mjs
          node tools/quality/article-revival-browser.mjs
      - name: Run audit
        if: always() && !cancelled()
        env:
          MODE: ${{ steps.cadence.outputs.mode }}
        run: |
          if [ "$MODE" != hourly ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            python tools/quality/publication.py --live
            python tools/quality/t04_scope.py --live
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            python tools/quality/audit.py --offline --mode "$MODE"
          else
            python tools/quality/audit.py --mode "$MODE" --previous /tmp/quality-state/latest.json
          fi
      - name: Isolated cloud persistence and delivery validation
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/quality/integration.py
      - name: Job summary
        if: always()
        run: cat quality-results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-results/
          retention-days: 90
      - name: Notify only new important findings
        if: github.event_name != 'pull_request' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/quality/notify.py
      - name: Persist history without site deployment
        if: github.event_name != 'pull_request' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/quality/persist.py
