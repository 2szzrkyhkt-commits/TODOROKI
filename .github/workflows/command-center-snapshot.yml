name: TODOROKI command center snapshot
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/command-center/**'
      - '.github/workflows/command-center-snapshot.yml'
      - 'docs/TODOROKI-TODO.md'
permissions:
  contents: read
concurrency:
  group: command-center-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify snapshot parser
        run: python -m unittest discover -s tools/command-center -p 'test_*.py' -v
      - name: Generate read-only snapshot
        run: python tools/command-center/snapshot.py
      - name: Render private dashboard
        run: python tools/command-center/dashboard.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: command-center-snapshot-${{ github.run_id }}
          path: |
            command-center-results/snapshot.json
            command-center-results/index.html
          retention-days: 30
