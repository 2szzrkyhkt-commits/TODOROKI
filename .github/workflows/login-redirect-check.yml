name: Login redirect validation
on:
  pull_request:
    paths:
      - 'login.html'
      - 'scripts/check-login-redirect.py'
      - '.github/workflows/login-redirect-check.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-login-redirect.py
