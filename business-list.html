
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TODOROKIの企業・経営記事一覧。資本配分、競争優位、M&A、経営者の意思決定を考える。">
  <title>企業・経営の記事一覧 | TODOROKI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #080808;
      color: #eae6dd;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
      line-height: 1.8;
    }
    header {
      padding: 24px 6%;
      border-bottom: 1px solid #29241a;
    }
    .logo {
      color: #c9a646;
      font-weight: bold;
      letter-spacing: 3px;
      text-decoration: none;
    }
    main {
      max-width: 1100px;
      margin: 70px auto;
      padding: 0 24px;
    }
    h1 { font-size: 30px; }
    .rule {
      width: 55px;
      height: 2px;
      background: #c9a646;
      margin-bottom: 35px;
    }
    .card {
      padding: 28px;
      background: #121212;
      border: 1px solid #302819;
      border-radius: 14px;
    }
    .tag {
      color: #c9a646;
      font-size: 12px;
      font-weight: bold;
    }
    .card h2 { font-size: 19px; }
    .card p { color: #aaa; font-size: 14px; }
    .back {
      display: inline-block;
      margin-top: 45px;
      color: #c9a646;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/">TODOROKI</a>
  </header>

  <main>
    <h1>企業・経営</h1>
    <div class="rule"></div>
    <p>資本配分、競争優位、M&A、経営者の意思決定を考える。</p>

    <div class="card">
      <span class="tag">BUSINESS</span>
      <h2>記事を準備中</h2>
      <p>企業経営に関する分析記事を順次公開します。</p>
    </div>

    <a class="back" href="/">← トップページに戻る</a>
  </main>
</body>
</html>
