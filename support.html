<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>TODOROKIを応援する</title><meta name="description" content="TODOROKIの無料記事・PDF制作への任意支援。"><style>body{margin:0;background:#0d0d0d;color:#eee5d5;font-family:system-ui,sans-serif;line-height:1.8}main{max-width:680px;margin:40px auto;padding:24px}h1,a{color:#d4af37}.panel{border:1px solid #6a5525;border-radius:16px;padding:24px;background:#17140e}.amounts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}button{font:inherit;border:1px solid #65532d;border-radius:9px;padding:12px;background:#211c12;color:#eee5d5;cursor:pointer}button[aria-pressed="true"]{outline:2px solid #d4af37}#checkout{margin-top:24px;background:#d4af37;color:#111;font-weight:bold;width:100%}button:disabled{opacity:.55;cursor:not-allowed}:focus-visible{outline:3px solid white;outline-offset:3px}small{color:#bfb7a6}</style><script src="/support.js" defer></script></head><body><main><a href="/">← TODOROKI</a><h1>TODOROKIを応援する</h1><p>記事やPDFが役に立ったら、無料コンテンツの制作とサイト運営を任意で応援していただけるとうれしいです。</p><div class="panel"><h2>支援金額を選ぶ</h2><div class="amounts" role="group" aria-label="支援金額"><button type="button" data-amount="300" aria-pressed="true">300円</button><button type="button" data-amount="500" aria-pressed="false">500円</button><button type="button" data-amount="1000" aria-pressed="false">1,000円</button><button type="button" data-amount="3000" aria-pressed="false">3,000円</button></div><button id="checkout" type="button" disabled>受付準備中</button><p id="status" role="status" aria-live="polite">受付状況を確認しています。</p><small>一回払い・ログイン不要です。支援による特典、個別相談、投資助言の提供はありません。支援の有無にかかわらず、公開記事・PDFは無料でご利用いただけます。</small></div><p>決済情報はStripeの決済画面で入力します。当サイトではカード番号を受け取りません。金額と支払先の表示を確認してお手続きください。</p><p><a href="/contact.html">支援・返金に関するお問い合わせ</a> · <a href="/privacy.html">プライバシーポリシー</a></p><noscript>支援にはJavaScriptが必要です。</noscript></main></body></html>
