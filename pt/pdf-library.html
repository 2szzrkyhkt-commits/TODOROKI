<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biblioteca de PDFs | TODOROKI</title><meta name="description" content="Explore os PDFs originais em japonês. O conteúdo dos documentos ainda não foi traduzido."><link rel="canonical" href="https://todoroki-gold.com/pt/pdf-library.html"><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#eae5dc;font:16px/1.8 system-ui,sans-serif}header{border-bottom:1px solid #514222;padding:18px 5%;display:flex;gap:20px;flex-wrap:wrap;align-items:center}a{color:#dbb95c}header a:first-child{font-size:22px;font-weight:800;letter-spacing:.16em;text-decoration:none}main{max-width:1100px;margin:auto;padding:42px 20px 90px}h1{font-size:clamp(30px,5vw,48px);color:#e7c670}p{color:#c5c0b6}.search{width:100%;padding:14px 16px;border:1px solid #6b542b;border-radius:8px;background:#161616;color:#fff;font:inherit;margin:18px 0}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px}.item{background:#14120e;border:1px solid #4e4024;border-radius:10px;padding:20px;overflow-wrap:anywhere}.item h2{font-size:17px;font-weight:650;line-height:1.6}.tag{font-size:12px;color:#e1c57b}footer{text-align:center;padding:22px;border-top:1px solid #42361d}</style><!-- TODOROKI hreflang start --><link rel="alternate" hreflang="en" href="https://todoroki-gold.com/en/pdf-library.html"><link rel="alternate" hreflang="es" href="https://todoroki-gold.com/es/pdf-library.html"><link rel="alternate" hreflang="pt" href="https://todoroki-gold.com/pt/pdf-library.html"><link rel="alternate" hreflang="zh-Hans" href="https://todoroki-gold.com/zh-Hans/pdf-library.html"><link rel="alternate" hreflang="zh-Hant" href="https://todoroki-gold.com/zh-Hant/pdf-library.html"><!-- TODOROKI hreflang end --></head><body><header><a href="/pt/">TODOROKI</a><a href="/pt/glossary.html">Glossário</a></header><main><h1>Biblioteca de PDFs</h1><p>Explore os PDFs originais em japonês. O conteúdo dos documentos ainda não foi traduzido.</p><input class="search" id="search" type="search" aria-label="Pesquisar PDFs" placeholder="Pesquisar PDFs"><p id="count" role="status">Carregando documentos…</p><div id="grid"></div><p><a href="/pdf-library.html">Biblioteca japonesa →</a></p></main><footer>TODOROKI</footer><script>(()=>{const grid=document.getElementById('grid'),count=document.getElementById('count'),input=document.getElementById('search');let docs=[];const synonyms={'mbo':['management buyout','compra de directivos','aquisição pela administração','管理层收购','管理層收購'],'dram':['memory','memoria','memória','存储器','記憶體'],'frb':['federal reserve','reserva federal','美联储','聯準會'],'sox':['semiconductor index','indice semiconductores','índice semicondutores','半导体指数','半導體指數'],'euv':['lithography','litografia','光刻'],'php':['security','seguridad','segurança','安全'],'nvidia':['gpu','英伟达','輝達'],'インフレ':['inflation','inflación','inflação','通胀','通膨'],'金利':['interest rate','tasa de interés','taxa de juros','利率'],'半導体':['semiconductor','semiconductores','semicondutores','半导体','半導體'],'株価':['stock price','precio de acciones','preço das ações','股价','股價'],'国債':['government bonds','bonos públicos','títulos públicos','国债','公債']};const normalize=s=>s.normalize('NFKC').toLowerCase();function render(){const q=normalize(input.value.trim());const filtered=docs.filter(f=>{const title=normalize(f.name);const terms=[title,...Object.entries(synonyms).filter(([key])=>title.includes(normalize(key))).flatMap(([,words])=>words)].join(' ');return !q||normalize(terms).includes(q)});count.textContent=filtered.length+' Documentos';grid.replaceChildren();for(const f of filtered){const article=document.createElement('article');article.className='item';const tag=document.createElement('div');tag.className='tag';tag.textContent='Original em japonês';const title=document.createElement('h2');title.textContent=f.name.replace(/\.pdf$/i,'').replace(/_/g,' ');const link=document.createElement('a');link.href='/pdf/'+encodeURIComponent(f.name);link.target='_blank';link.rel='noopener';link.textContent='Abrir PDF →';article.append(tag,title,link);grid.append(article)}}input.addEventListener('input',render);fetch('https://api.github.com/repos/2szzrkyhkt-commits/TODOROKI/contents/pdf?ref=main',{headers:{Accept:'application/vnd.github+json'}}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{docs=Array.isArray(data)?data.filter(f=>f.type==='file'&&/\.pdf$/i.test(f.name)).sort((a,b)=>a.name.localeCompare(b.name)):[];render()}).catch(()=>{count.textContent='Não foi possível carregar o arquivo. Abra a biblioteca japonesa.'})})();</script></body></html>
