
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TODOROKIの株式投資記事一覧。企業価値、価格と価値、投資判断を数字から考える。">
  <title>株式投資の記事一覧 | TODOROKI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #080808;
      color: #eae6dd;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
      line-height: 1.8;
    }
    header {
      padding: 24px 6%;
      border-bottom: 1px solid #29241a;
    }
    .logo {
      color: #c9a646;
      font-weight: bold;
      letter-spacing: 3px;
      text-decoration: none;
    }
    main {
      max-width: 1100px;
      margin: 70px auto;
      padding: 0 24px;
    }
    h1 { font-size: 30px; }
    .rule {
      width: 55px;
      height: 2px;
      background: #c9a646;
      margin-bottom: 35px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }
    .card {
      display: block;
      padding: 28px;
      background: #121212;
      border: 1px solid #302819;
      border-radius: 14px;
      color: inherit;
      text-decoration: none;
      transition: border-color .2s;
    }
    .card:hover { border-color: #c9a646; }
    .tag {
      color: #c9a646;
      font-size: 12px;
      font-weight: bold;
    }
    .card h2 { font-size: 19px; }
    .card p { color: #aaa; font-size: 14px; }
    .back {
      display: inline-block;
      margin-top: 45px;
      color: #c9a646;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/">TODOROKI</a>
  </header>

  <main>
    <h1>株式投資</h1>
    <div class="rule"></div>
    <p>企業価値、バリュエーション、投資判断を数字から考える。</p>

    <div class="cards">
      <a class="card" href="/investment.html">
        <span class="tag">INVESTMENT</span>
        <h2>投資とは何か</h2>
        <p>投資の本質と企業価値を考える。</p>
      </a>

      <a class="card" href="/price-value.html">
        <span class="tag">INVESTMENT</span>
        <h2>価格と価値の違い</h2>
        <p>株価と企業価値の違い、安全域と投資判断を解説。</p>
      </a>
    </div>

    <a class="back" href="/">← トップページに戻る</a>
  </main>
</body>
</html>
